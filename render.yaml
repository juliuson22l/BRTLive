services:
  - type: web
    name: brtlive-backend
    runtime: python
    plan: free
    buildCommand: |
      pip install --upgrade pip  wheel setuptools
      pip install --no-cache-dir --only-binary :all: -r requirements.txt || pip install --no-cache-dir -r requirements.txt
    startCommand: |
      alembic upgrade head
      uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: DATABASE_URL
        fromDatabase:
          name: brtlivedb
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 30
      - key: DEBUG
        value: "False"
      - key: BACKEND_CORS_ORIGINS
        value: "*"

databases:
  - name: brtlivedb
    databaseName: brtlivedb
    user: juliusdb
    plan: free
